name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
      # Native PostgreSQL/security acceptance uses the separately authorised
      # Windows fixture; this hosted job does not establish those results.
      - name: Ordinary tests (excludes required native PostgreSQL gate)
        shell: pwsh
        run: dotnet test --configuration Release --no-build --filter "Category!=RequiresPostgreSql"
