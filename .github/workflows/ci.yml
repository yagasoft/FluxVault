name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Test with disposable PostgreSQL
        shell: pwsh
        run: |
          $taskPgCommand = Get-Command postgres.exe -ErrorAction SilentlyContinue
          $taskPgBin = if ($null -ne $taskPgCommand) { Split-Path -Parent $taskPgCommand.Source } else { $null }
          if (-not $taskPgBin -and $env:PGBIN -and (Test-Path -LiteralPath (Join-Path $env:PGBIN 'postgres.exe'))) {
            $taskPgBin = $env:PGBIN
          }
          $taskPgParent = Join-Path $env:ProgramFiles 'PostgreSQL'
          if (-not $taskPgBin -and (Test-Path -LiteralPath $taskPgParent)) {
            $taskPgBin = Get-ChildItem -LiteralPath $taskPgParent -Directory |
              Sort-Object Name -Descending |
              ForEach-Object { Join-Path $_.FullName 'bin' } |
              Where-Object { Test-Path -LiteralPath (Join-Path $_ 'postgres.exe') } |
              Select-Object -First 1
          }
          if (-not $taskPgBin) { throw 'CI requires existing PostgreSQL server binaries; no database test is skipped.' }
          ./eng/test-repository-integrity.ps1 -PostgreSqlBinPath $taskPgBin -RunFullSuite
