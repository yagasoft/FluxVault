name: release-package

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version tag, for example v1.0.1
        required: true
        default: v1.0.1
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Packaging tests
        run: dotnet test tests\FluxVault.Integration.Tests\FluxVault.Integration.Tests.csproj --filter PackagingTests
      - name: Build release package
        shell: pwsh
        run: .\eng\release-package.ps1 -Configuration Release -ReleaseVersion "${{ inputs.release_version }}"
      - name: Verify branded setup exists
        shell: pwsh
        run: |
          $releaseVersion = "${{ inputs.release_version }}"
          if (-not (Test-Path -LiteralPath "artifacts\release\Yagasoft-FluxVault-$releaseVersion-win-x64-Setup.exe")) {
            throw "Missing unsigned consumer setup artefact."
          }
      - name: Upload release artefacts
        uses: actions/upload-artifact@v4
        with:
          name: fluxvault-release-package
          path: artifacts/release
