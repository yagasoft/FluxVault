name: release-package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Packaging tests
        run: dotnet test tests\FluxVault.Integration.Tests\FluxVault.Integration.Tests.csproj --filter PackagingTests
      - name: Build release package
        shell: pwsh
        run: .\eng\release-package.ps1 -Configuration Release
      - name: Verify branded setup exists
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath artifacts\release\Yagasoft-FluxVault-v1.0.0-win-x64-Setup.exe)) {
            throw "Missing unsigned consumer setup artefact."
          }
      - name: Upload release artefacts
        uses: actions/upload-artifact@v4
        with:
          name: fluxvault-release-package
          path: artifacts/release
